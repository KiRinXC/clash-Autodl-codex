name: clash-codex-autodl CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: ShellCheck production scripts
        run: |
          shellcheck \
            command.sh \
            install-clash.sh \
            install-codex.sh \
            setup_mihomo.sh \
            uninstall.sh \
            converter.sh \
            lib/install_runtime.sh \
            lib/codex_common.sh \
            lib/codex_profiles.sh \
            lib/codex_sessions.sh

      - name: Help commands
        run: |
          bash command.sh --help
          bash install-clash.sh --help
          bash install-codex.sh --help
          bash setup_mihomo.sh --help
          bash uninstall.sh --help
          bash converter.sh --help

      - name: Smoke tests
        run: |
          for test_file in tests/*.sh; do
            echo "Running $test_file"
            bash "$test_file"
          done

      - name: Sensitive data scan
        run: |
          api_key_pattern='OPENAI_API_KEY=["'"'"']?[A-Za-z0-9_-]{20,}'
          secret_key_pattern='sk-[A-Za-z0-9]{20,}'
          if git grep --line-number -E "${secret_key_pattern}|${api_key_pattern}" -- \
              . \
              ':(exclude)README.md'; then
            echo 'Possible sensitive data found'
            exit 1
          fi
